name: CI/CD Pipeline              # Nombre del workflow

on:                               # Define los eventos que disparan el workflow
  push:                           # Se ejecuta cuando hay un push
    branches: [ "main" ]          # Solo en la rama main

permissions:                      # Configuración de permisos para el GITHUB_TOKEN
  contents: write                 # Permite al bot hacer push a la rama gh-pages

jobs:                             # Definición de los jobs (tareas)
  quality-check:                  # Primer job: análisis de calidad
    runs-on: ubuntu-latest        # Se ejecuta en un runner Ubuntu
    steps:                        # Lista de pasos dentro del job
    - name: Checkout código       # Paso 1: clona el repo en el runner
      uses: actions/checkout@v4   # Usa la acción oficial checkout v4
      with:
        fetch-depth: 0            # Clona todo el historial de commits (necesario para SonarCloud)

    - name: Set up JDK 21         # Paso 2: instala Java 21 en el runner
      uses: actions/setup-java@v4 # Usa la acción oficial setup-java
      with:
        java-version: '21'        # Versión de Java requerida por SonarCloud
        distribution: 'temurin'   # Distribución de Eclipse Temurin (Adoptium)

    - name: SonarCloud Scan       # Paso 3: ejecuta el análisis en SonarCloud
      uses: SonarSource/sonarqube-scan-action@v8.1.0 # Acción oficial SonarCloud
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    # Token de GitHub para autenticación
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}      # Token de SonarCloud para subir resultados

  deploy:                         # Segundo job: despliegue en GitHub Pages
    needs: quality-check          # Solo se ejecuta si el job quality-check termina bien
    runs-on: ubuntu-latest        # Se ejecuta en un runner Ubuntu
    steps:                        # Lista de pasos dentro del job
    - name: Checkout código       # Paso 1: clona el repo en el runner
      uses: actions/checkout@v4   # Usa la acción oficial checkout v4
      with:
        fetch-depth: 0            # Clona todo el historial de commits

    - name: Deploy a GitHub Pages # Paso 2: despliega el sitio en GitHub Pages
      uses: peaceiris/actions-gh-pages@v3           # Acción oficial para GitHub Pages
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}   # Token con permisos de escritura
        publish_dir: ./                             # Carpeta que se publica (raíz del repo)
